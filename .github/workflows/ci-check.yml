name: ci-check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (biome + tsc, tests included)
        run: bun run lint
      # The web app has its own tsconfig (DOM libs, JSX) and was never
      # typechecked in CI - which is how it accumulated latent type errors.
      - name: Typecheck web app
        run: bun run --cwd apps/start typecheck
      - name: Test
        run: bun run test
